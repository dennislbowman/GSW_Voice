dependencies:
  espressif/usb:
    version: "^1.4.1"
  lvgl/lvgl:
    version: "9.5.0"
  idf:
    version: '>=5.3.2'

  waveshare/esp32_s3_touch_amoled_2_06:
    # v2 is the current board BSP line; review a future major with both IDF lines and hardware.
    version: "^2.0.0"

  chmorgan/esp-audio-player:
    version: "1.1.*"
    public: true

  chmorgan/esp-file-iterator:
    version: "1.0.0"
    public: true
  espressif/cjson: "*"
  
  espressif/esp-sr: "^2.1.3"

  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  espressif/esp_hosted:
    version: "~2"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  espressif/mavlink:
    version: "~1"
  

description: Board Support Package for ESP32-S3-Touch-AMOLED-2.06
version: 0.0.2
